<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebView 2 Launcher</title>
    <style>
        :root {
            --bg-color: #0f0f12;
            --panel-color: #16161a;
            --input-bg: #22222a;
            --text-color: #f0f0f5;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --error-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .launcher-box {
            background-color: var(--panel-color);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            text-align: center;
            border: 1px solid #27272a;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .url-input {
            width: 100%;
            padding: 16px 60px 16px 20px;
            background-color: var(--input-bg);
            border: 2px solid transparent;
            border-radius: 30px;
            color: var(--text-color);
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        .url-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
        }

        .url-input.error {
            border-color: var(--error-color);
            animation: shake 0.4s ease-in-out;
        }

        .go-btn {
            position: absolute;
            right: 6px;
            width: 48px;
            height: 48px;
            background-color: var(--accent-color);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .go-btn:hover {
            background-color: var(--accent-hover);
        }

        .go-btn:active {
            transform: scale(0.95);
        }

        .go-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
    </style>
</head>
<body>

    <div class="launcher-box">
        <h1>WebView 2</h1>
        <div class="input-container">
            <input 
                type="text" 
                id="urlInput" 
                class="url-input" 
                placeholder="Enter URL (e.g., google.com)"
                autocomplete="off"
                spellcheck="false"
            >
            <button id="goBtn" class="go-btn">
                <svg viewBox="0 0 24 24">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const goBtn = document.getElementById('goBtn');

        function launchWebView() {
            let inputVal = urlInput.value.trim();
            
            if (!inputVal) {
                triggerError();
                return;
            }

            if (!/^https?:\/\//i.test(inputVal)) {
                inputVal = 'https://' + inputVal;
            }

            try {
                const validatedUrl = new URL(inputVal);
                urlInput.classList.remove('error');

                const windowFeatures = "menubar=no,location=no,resizable=yes,scrollbars=yes,status=no,toolbar=no,width=1280,height=720";
                
                // Открываем новое WebView-подобное окно
                const newWindow = window.open(validatedUrl.href, '_blank', windowFeatures);

                if (newWindow) {
                    // Агрессивный хак для обхода защиты браузера и закрытия вкладки-открывашки
                    window.open('', '_self', ''); 
                    window.close();
                    
                    // Резервный вызов, если первый заблокирован политиками безопасности
                    setTimeout(() => {
                        window.location.href = "about:blank";
                    }, 50);
                } else {
                    alert("Pop-up blocked! Please allow pop-ups for this site to launch WebView 2.");
                }

            } catch (e) {
                triggerError();
            }
        }

        function triggerError() {
            urlInput.classList.add('error');
            setTimeout(() => urlInput.classList.remove('error'), 400);
        }

        goBtn.addEventListener('click', launchWebView);
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') launchWebView();
        });
    </script>
</body>
</html>
